[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lspr-io"
description = "Shared HDF5/session IO helpers for the LSPR Suite."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "h5py",
    "numpy",
    "lspr-core>=0.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "lspr_io.version.__version__"}
