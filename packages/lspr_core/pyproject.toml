[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lspr-core"
description = "Shared core models and utilities for the LSPR Suite."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
# Version bounds follow the pinning policy in CLAUDE.md ("Dependency Pinning"):
# floor = currently tested version, ceiling = next breaking-change boundary.
dependencies = [
    "pydantic>=2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "lspr_core.version.__version__"}
