[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lspr-ui"
description = "Shared Qt theme and icon helpers for the LSPR Suite."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "PyQt6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lspr_ui = ["icon_assets/*.svg"]

[tool.setuptools.dynamic]
version = {attr = "lspr_ui.version.__version__"}
