[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lspr-ui"
description = "Shared Qt theme and icon helpers for the LSPR Suite."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
# Version bounds follow the pinning policy in CLAUDE.md ("Dependency Pinning"):
# floor = currently tested version, ceiling = next breaking-change boundary.
dependencies = [
    "PyQt6>=6.11,<7",
    # See apps/LSPRi/eva/pyproject.toml for why - PyQt6-sip 13.11.1 has a
    # reproducible access-violation crash on Python 3.14, fixed in 13.12.0.
    "PyQt6-sip>=13.12.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lspr_ui = ["icon_assets/*.svg"]

[tool.setuptools.dynamic]
version = {attr = "lspr_ui.version.__version__"}
