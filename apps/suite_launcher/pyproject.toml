[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lspr-suite-launcher"
description = "Startup selector for the LSPR Suite applications."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "PyQt6",
    "lspr-ui>=0.1.0",
]

[project.scripts]
lspr-suite = "suite_launcher.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "suite_launcher.version.APP_VERSION"}
