[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lspr-suite-launcher"
description = "Startup selector for the LSPR Suite applications."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "PyQt6",
    # See apps/LSPRi/eva/pyproject.toml for why - PyQt6-sip 13.11.1 has a
    # reproducible access-violation crash on Python 3.14, fixed in 13.12.0.
    "PyQt6-sip>=13.12.0",
    "lspr-ui>=0.1.0",
    "certifi",
]

[project.scripts]
lspr-suite = "suite_launcher.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "suite_launcher.version.APP_VERSION"}
