name: release

# Manual release path: push an annotated "vX.Y.Z" tag yourself (see
# apps/suite_launcher/docs or apps/sLSPR/acq/docs/versioning.md for the
# by-hand checklist) and this builds + publishes it. For releases that
# happen automatically whenever an app changes, see auto-release.yml.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    uses: ./.github/workflows/_build-and-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
