name: tests

on:
  push:
  pull_request:

jobs:
  # Lint of LSPRi Evaluation, two checks that catch what the tests cannot:
  #  - ruff with the app's own rule list (apps/LSPRi/eva/pyproject.toml, [tool.ruff.lint]): a silent `except Exception`, a loop
  #    variable captured by a closure, a dead `# noqa`. Pinned to the version of the pre-commit hooks so a new release cannot
  #    turn the build red by itself.
  #  - import-linter with the contracts in .importlinter: imports between the app's packages only point downwards, the two
  #    shared packages and the pure-science modules of LSPRi Evaluation stay free of Qt. It reads the source files and imports nothing, so it needs no dependencies installed.
  lint:
    name: lint (ruff, import layers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff and import-linter
        run: python -m pip install ruff==0.15.20 import-linter==2.13

      - name: Lint
        run: ruff check apps/LSPRi/eva/src apps/LSPRi/eva/tools

      - name: Import layers
        env:
          PYTHONPATH: packages/lspr_core/src:packages/lspr_io/src:packages/lspr_ui/src:apps/LSPRi/eva/src
        run: lint-imports

  unittest:
    name: unittest (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: windows-latest
    timeout-minutes: 60  # measured 2026-10-30: the whole suite took 17.5 min of tests on one runner; a shard is about a third of that
    strategy:
      fail-fast: false  # a red shard must not hide what the other shards found
      matrix:
        shard: [1, 2, 3]  # the test files are split between these; each shard is a runner of its own (free on a public repo)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # One process per test file (see the docstring of tools/run_tests_per_file.py): a single process for all files took 3 to 5 hours.
      # This shard's share of the files; tests/unit/test_run_tests_per_file.py checks that the shards together are every file once.
      - name: Run unit tests
        run: python tools/run_tests_per_file.py --shard ${{ matrix.shard }}/${{ strategy.job-total }}
