name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    timeout-minutes: 120  # a guess for the first runs: 38 min here with 6 files at a time; tighten once a CI run has been measured
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # One process per test file (see the docstring of tools/run_tests_per_file.py): a single process for all files took 3 to 5 hours.
      - name: Run unit tests
        run: python tools/run_tests_per_file.py
